name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Tests
    # Skip CI on version bump commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test-unit:
    name: Unit Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

  version:
    name: Version Bump
    needs: [test, test-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new_version: ${{ steps.bump.outputs.new_version }}
      should_release: ${{ steps.bump.outputs.should_release }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: bump
        run: |
          # Extraemos todos los mensajes desde el último tag generado
          # Para asegurarnos de tener todos los tags, hacemos fetch
          git fetch --tags origin || true
          
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "previous_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          fi
          
          if [ -z "$LAST_TAG" ]; then
            echo "No hay tags anteriores. Evaluando todos los commits."
            COMMIT_MSGS=$(git log --format=%B)
          else
            echo "Evaluando commits desde el tag: $LAST_TAG"
            COMMIT_MSGS=$(git log ${LAST_TAG}..HEAD --format=%B)
          fi
          
          echo "Mensajes a evaluar:"
          echo "$COMMIT_MSGS"
          
          # Check for breaking change (major)
          if echo "$COMMIT_MSGS" | grep -qE '^[a-z]+!:|BREAKING CHANGE'; then
            BUMP="major"
          # Check for feat (minor)
          elif echo "$COMMIT_MSGS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          # Check for fix, refactor, perf, style, docs, test, ci, chore (patch)
          elif echo "$COMMIT_MSGS" | grep -qE '^(fix|refactor|perf|style|docs|test|ci|chore|build|skill)(\(.+\))?:'; then
            BUMP="patch"
          else
            echo "No conventional commit prefix found. Skipping version bump."
            if [ -n "$LAST_TAG" ]; then
              echo "Ensuring GitHub Release exists for latest tag: $LAST_TAG"
              echo "new_version=${LAST_TAG}" >> $GITHUB_OUTPUT
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
            echo "bumped=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Detected bump type: $BUMP"
          
          # Bump version (npm version creates the git tag automatically)
          NEW_VERSION=$(npm version $BUMP --no-git-tag-version)
          echo "New version: $NEW_VERSION"
          
          # Commit and tag
          git add package.json package-lock.json
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          
          # Push commit and tag
          git push origin main --follow-tags
          
          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Ensure GitHub Release
        if: steps.bump.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump.outputs.new_version }}
          PREVIOUS_RELEASE_TAG: ${{ steps.bump.outputs.previous_tag }}
        run: |
          set -euo pipefail

          ensure_release() {
            local tag="$1"

            if [ -z "$tag" ]; then
              return 0
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub Release already exists for $tag."
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              echo "Creating GitHub Release for $tag (attempt ${attempt}/5)..."
              if gh release create "$tag" --title "$tag" --generate-notes; then
                return 0
              fi

              if [ "$attempt" -lt 5 ]; then
                sleep_seconds=$((attempt * 20))
                echo "Release creation failed. Retrying in ${sleep_seconds}s..."
                sleep "$sleep_seconds"
              fi
            done

            echo "GitHub Release creation failed for $tag after 5 attempts."
            return 1
          }

          ensure_release "$PREVIOUS_RELEASE_TAG"
          if [ "$RELEASE_TAG" != "$PREVIOUS_RELEASE_TAG" ]; then
            ensure_release "$RELEASE_TAG"
          fi

  deploy:
    name: Deploy to Vercel
    needs: [test, test-unit, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the latest commit (which may include the version bump)
          ref: main

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if vercel deploy --prebuilt --archive=tgz --prod --yes --token=${{ secrets.VERCEL_TOKEN }}; then
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep_seconds=$((attempt * 20))
              echo "Deploy failed. Retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
          done

          echo "Vercel deployment failed after 3 attempts."
          exit 1
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
